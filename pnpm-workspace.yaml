minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

publicHoistPattern:
  - '@intlify/*'

shellEmulator: true

packages:
  - playground
  - docs

overrides:
  magic-regexp: 'workspace:*'
  nuxt: 4.7.0
  vite: 8.3.8
  vue: 3.5.46

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': true
  esbuild: false
  shadcn-docs-nuxt: false
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  vue-demi: false
